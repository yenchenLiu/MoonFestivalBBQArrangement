# Fly.io 設定。部署步驟見 README「部署」段落。
app = "moon-bbq"          # 改成你自己的、全球唯一的 app 名稱
primary_region = "nrt"    # 東京，離台灣最近

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DB_FILE = "/data/bbq.db"
  # ACCESS_CODE 請用 fly secrets set 設定，不要寫在這裡

[mounts]
  source = "bbq_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
